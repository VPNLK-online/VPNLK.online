name: Sync VMess configs

on:
  schedule:
    # Every 10 minutes. GitHub may start scheduled runs late when it is busy.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/sync.yml"

permissions:
  contents: write

concurrency:
  group: sync-vmess
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Fetch the feed and rebuild the list
        env:
          # Optional repository variable. Empty means the free servers API.
          FEED_URL: ${{ vars.FEED_URL }}
        run: python3 scripts/update.py

      - name: Commit if the list changed
        run: |
          git add README.md
          if [ -d configs ]; then git add configs; fi
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync latest VMess configs"
          git push
